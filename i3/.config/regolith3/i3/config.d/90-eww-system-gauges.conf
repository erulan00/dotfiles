# eww system gauges overlay (CPU / RAM / VRAM)

# CPU / RAM / VRAM の円形ゲージを起動($mod+Shift+g で表示/非表示)
exec --no-startup-id "$HOME/.local/bin/system-gauges-start"

# $mod+g は他バインドと衝突するため Shift+g を使用
bindsym $mod+Shift+g exec --no-startup-id "$HOME/.local/bin/system-gauges-toggle"

# ewwウィンドウの見た目とフォーカス制御
for_window [title="Eww - system-gauges"] floating enable, sticky enable, border none
no_focus [title="Eww - system-gauges"]
